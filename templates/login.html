<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            position: relative;
            overflow: hidden;
        }

        /* Animated gradient mesh background */
        .bg-glow {
            position: absolute; inset: 0; z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(59,130,246,0.35), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(168,85,247,0.3), transparent 45%),
                radial-gradient(circle at 50% 95%, rgba(34,211,238,0.22), transparent 50%);
            animation: drift 14s ease-in-out infinite alternate;
        }
        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-3%, 3%) scale(1.08); }
        }

        .orb {
            position: absolute; border-radius: 50%; filter: blur(2px);
            background: linear-gradient(135deg, rgba(96,165,250,0.5), rgba(168,85,247,0.4));
            animation: float 9s ease-in-out infinite;
            z-index: 0;
        }
        .orb1 { width: 18px; height: 18px; top: 18%; left: 12%; animation-delay: 0s; }
        .orb2 { width: 10px; height: 10px; top: 70%; left: 85%; animation-delay: 2s; }
        .orb3 { width: 14px; height: 14px; top: 80%; left: 20%; animation-delay: 4s; }
        .orb4 { width: 8px;  height: 8px;  top: 25%; left: 80%; animation-delay: 1s; }
        .orb5 { width: 12px; height: 12px; top: 50%; left: 6%;  animation-delay: 3s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.7; }
            50% { transform: translateY(-26px) translateX(10px); opacity: 1; }
        }

        .auth-wrapper { position: relative; z-index: 2; width: 100%; max-width: 420px; padding: 20px; }
        .auth-card {
            background: rgba(22, 27, 44, 0.65);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 44px 36px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
            animation: cardIn 0.6s ease;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-badge {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; margin: 0 auto 18px;
            box-shadow: 0 0 30px rgba(96,165,250,0.5);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(96,165,250,0.4); }
            50% { box-shadow: 0 0 34px rgba(168,85,247,0.55); }
        }

        h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 4px;
            font-size: 26px;
        }
        .subtitle { text-align: center; color: #8b96ab; font-size: 14px; margin-bottom: 28px; }

        .form-group { margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 600; color: #a7b2c6; margin-bottom: 6px; display: block; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            color: #e5eaf2;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        input::placeholder { color: #5b6880; }
        input:focus {
            border-color: #3b82f6;
            background: rgba(59,130,246,0.07);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            background-size: 200% 200%;
            color: white;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            transition: transform 0.15s, box-shadow 0.15s, background-position 0.5s;
            box-shadow: 0 8px 24px rgba(59,130,246,0.35);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(168,85,247,0.45);
            background-position: 100% 50%;
        }
        .btn-submit:active { transform: translateY(0); }

        .switch-text { text-align: center; margin-top: 22px; font-size: 14px; color: #8b96ab; }
        .switch-text a { color: #60a5fa; font-weight: 600; text-decoration: none; }
        .switch-text a:hover { text-decoration: underline; }

        .alert {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            margin-bottom: 18px;
            border-left: 3px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    <div class="orb orb5"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo-badge">💼</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to track your job applications</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Log In</button>
            </form>

            <p class="switch-text">Don't have an account? <a href="/signup">Sign up</a></p>
        </div>
    </div>
</body>
</html>
